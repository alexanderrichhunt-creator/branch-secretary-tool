<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1a73e8" />
    <title>Offline · Branch Secretary</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(1.25rem + env(safe-area-inset-top)) 1.25rem calc(1.25rem + env(safe-area-inset-bottom));
        background: #f6f8fc;
        color: #202124;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      main {
        width: min(100%, 26rem);
        background: #fff;
        border: 1px solid #dadce0;
        border-radius: 12px;
        padding: 1.5rem 1.35rem 1.35rem;
        text-align: center;
      }
      img {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1rem;
      }
      h1 {
        font-size: 1.35rem;
        line-height: 1.25;
        margin: 0.9rem 0 0.4rem;
      }
      p {
        color: #5f6368;
        font-size: 1rem;
        line-height: 1.45;
        margin: 0 0 1.1rem;
      }
      button {
        appearance: none;
        border: 0;
        background: #1a73e8;
        color: #fff;
        font: inherit;
        font-weight: 600;
        min-height: 2.75rem;
        padding: 0.55rem 1.1rem;
        border-radius: 8px;
        width: 100%;
      }
      button:focus-visible {
        outline: 3px solid #8ab4f8;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/static/icons/icon-192.png" alt="" width="72" height="72" />
      <h1>You're offline</h1>
      <p>
        Branch Secretary needs a connection to show schedules and member records.
        That information stays on the server. This phone does not keep a copy that could become stale or belong to someone else.
      </p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        window.location.reload();
      });
    </script>
  </body>
</html>
