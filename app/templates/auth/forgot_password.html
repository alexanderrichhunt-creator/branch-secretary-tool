{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 fw-bold mb-3">Reset password</h1>
        <p class="muted mb-4">Enter your account email. If email delivery is configured, we will send a reset link. Otherwise, ask an administrator to set a new password for you.</p>

        <form method="post" action="{{ url_for('auth.forgot_password_post') }}">
          <div class="mb-3">
            <label class="form-label big-label" for="email">Email</label>
            <input class="form-control form-control-lg" type="email" id="email" name="email" required autofocus autocomplete="email" />
          </div>
          <button class="btn btn-primary btn-lg w-100" type="submit">Send reset link</button>
        </form>

        <hr class="my-4" />
        <p class="small mb-0">
          <a href="{{ url_for('auth.login') }}">Back to sign in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
