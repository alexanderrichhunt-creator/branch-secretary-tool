{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 fw-bold mb-3">Choose a new password</h1>
        <p class="muted mb-4">Use at least 8 characters.</p>

        <form method="post" action="{{ url_for('auth.reset_password_post', token=token) }}">
          <div class="mb-3">
            <label class="form-label big-label" for="new_password">New password</label>
            <input class="form-control form-control-lg" type="password" id="new_password" name="new_password" required minlength="8" autocomplete="new-password" autofocus />
          </div>
          <div class="mb-3">
            <label class="form-label big-label" for="new_password_confirm">Confirm new password</label>
            <input class="form-control form-control-lg" type="password" id="new_password_confirm" name="new_password_confirm" required minlength="8" autocomplete="new-password" />
          </div>
          <button class="btn btn-primary btn-lg w-100" type="submit">Update password</button>
        </form>

        <hr class="my-4" />
        <p class="small mb-0">
          <a href="{{ url_for('auth.login') }}">Back to sign in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
